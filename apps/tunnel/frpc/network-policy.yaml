apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frpc
  namespace: tunnel
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: ${SECRET_FRP_SERVER_IP}/32
      ports:
        - protocol: TCP
          port: 7000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
