apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/description: Home automation
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: home-assistant.png
    gethomepage.dev/href: https://ha.${SECRET_PUBLIC_DOMAIN}
    gethomepage.dev/widget.type: "homeassistant"
    gethomepage.dev/widget.url: "http://homeassistant.monitoring:8123"
    gethomepage.dev/widget.key: "${SECRET_HOMEASSISTANT_API_KEY}"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ha.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
      middlewares:
        - name: trusted-only
          namespace: kube-system
        - name: redirect-to-https
          namespace: kube-system
    - match: Host(`ha.${SECRET_PUBLIC_DOMAIN}`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
      middlewares:
        - name: trusted-only
          namespace: kube-system
        - name: redirect-to-https
          namespace: kube-system
