apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Homepage
    gethomepage.dev/description: Homelab dashboard
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: homepage.png
    gethomepage.dev/href: https://homepage.${SECRET_DOMAIN}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`homepage.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        - name: trusted-only
          namespace: kube-system
        - name: redirect-to-https
          namespace: kube-system
    - match: Host(`homepage.${SECRET_PUBLIC_DOMAIN}`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        - name: trusted-only
          namespace: kube-system
        - name: redirect-to-https
          namespace: kube-system
