apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: games
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: minecraft
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: itzg-charts
        namespace: flux-system
      version: 5.4.0
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    workloadAsStatefulSet: true
    autoscaled: true
    strategyType: RollingUpdate
    image:
      repository: itzg/minecraft-server
      tag: 2026.11.1-java25
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 1000m
        memory: 5Gi
      limits:
        memory: 5Gi
    terminationGracePeriodSeconds: 120
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 3000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    startupProbe:
      enabled: true
      periodSeconds: 2
      failureThreshold: 300
    readinessProbe:
      initialDelaySeconds: 0
      periodSeconds: 2
    livenessProbe:
      initialDelaySeconds: 0
    extraEnv:
      ENFORCE_WHITELIST: "true"
    minecraftServer:
      eula: "TRUE"
      type: FABRIC
      version: "26.3"
      memory: 4G
      modrinth:
        projects:
          - lithium:Lal8mJGR # mc26.3-0.26.4-fabric
          - ferrite-core:d5ddUdiB # 9.0.0-fabric
          - fabric-api:Zns5SSRA # 0.166.2+26.3 (required by fabricexporter, chunky)
          - spark:e3hsPc1o # 1.10.187-fabric
          - fabricexporter:oWz8OvaM # 1.0.23+26.3
          - chunky:86FKD9qx # 1.5.66
      motd: "deadlock lovers"
      onlineMode: true
      whitelist: "${MC_WHITELIST}"
      ops: "Pau__"
      serviceType: ClusterIP
      extraPorts:
        - name: metrics # fabricexporter
          containerPort: 25585
          protocol: TCP
          service:
            enabled: true
            embedded: false
            type: ClusterIP
            port: 25585
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: "mc.${SECRET_DOMAIN},mc.${SECRET_PUBLIC_DOMAIN}"
      mc-router.itzg.me/autoScaleAsleepMOTD: "Apagado - Conectate para encender"
      mc-router.itzg.me/autoScaleLoadingMOTD: "Un momentito..."
      mc-router.itzg.me/autoScaleWaitTimeout: "120s"
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft-data
    extraDeploy:
      - apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: minecraft
        spec:
          selector:
            matchLabels:
              app: minecraft-metrics
          endpoints:
            - port: metrics
              path: /metrics
              interval: 1m
